<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',path='/css/base.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',path='/css/bootstrap.css') }}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TodoApp</title>

<body>
<nav class="navbar fixed-top d-flex align-items-center px-4 py-2 bg-dark text-white">

    <!-- LEFT SIDE -->
    <div class="d-flex align-items-center gap-3">

        <div class="fw-bold fs-5 me-2">
            🚀 Todo App
        </div>

        {% if user %}
        <a href="/todos/todo-page"
           class="text-white text-decoration-none fw-semibold px-2">
            Home
        </a>
        {% endif %}

    </div>

    <!-- RIGHT SIDE -->
    {% if user %}
    <div class="ms-auto">
        <button onclick="logout()" class="btn btn-sm btn-outline-light rounded-pill px-3">
            Logout
        </button>
    </div>
    {% endif %}

</nav>

{% block content %}

{% endblock content %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/jquery-slim.js')}}"></script>
<script src="{{ url_for('static', path='js/popper.js')}}"></script>
<script src="{{ url_for('static', path='js/bootstrap.js')}}"></script>
<script src="{{ url_for('static', path='js/base.js')}}" defer></script>
</body>

</html>
